# Florece — dominio público + puerto IP de respaldo
# HTTPS lo gestiona Certbot (bloques 443 se añaden al emitir el cert).

# Redirect HTTP → HTTPS (cuando el cert ya existe; certbot puede reescribir esto)
server {
    listen 80;
    listen [::]:80;
    server_name floreceapp.com www.floreceapp.com;

    client_max_body_size 25m;

    # ACME challenge (certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://floreceapp.com$request_uri;
    }
}

# Puerto IP de respaldo (sin TLS) — útil si el DNS aún no apunta
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 25m;

    location /storage/ {
        alias /var/lib/florece/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /backend/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3020/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3020/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# HTTPS principal (certbot --nginx suele inyectar ssl_certificate aquí;
# este bloque sirve de plantilla si el cert ya está en /etc/letsencrypt)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name floreceapp.com www.floreceapp.com;

    # Rutas de cert — certbot las confirma/ajusta al emitir
    ssl_certificate     /etc/letsencrypt/live/floreceapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floreceapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location /storage/ {
        alias /var/lib/florece/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /backend/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3020/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3020/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
